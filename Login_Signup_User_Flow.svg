<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
.step { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:1; }
.decision { fill:#FAEEDA; stroke:#854F0B; stroke-width:1; }
.terminal { fill:#C0DD97; stroke:#27500A; stroke-width:1; }
.title-text { font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:600; fill:#1a1a1a; }
.sub-text { font-family:Arial,Helvetica,sans-serif; font-size:11px; fill:#333333; }
.main-title { font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; fill:#111111; }
.arrow { stroke:#555555; stroke-width:1.5; fill:none; }
</style>
<rect x="0" y="0" width="680" height="900" fill="#ffffff"/>

<text x="340" y="25" text-anchor="middle" class="main-title">Login &amp; signup user flow — Sukraven livestock marketplace</text>

<line x1="340" y1="84" x2="340" y2="120" class="arrow" marker-end="url(#arrow)"/>
<line x1="340" y1="164" x2="340" y2="200" class="arrow" marker-end="url(#arrow)"/>
<line x1="340" y1="244" x2="340" y2="280" class="arrow" marker-end="url(#arrow)"/>
<line x1="340" y1="324" x2="340" y2="360" class="arrow" marker-end="url(#arrow)"/>

<g><rect x="180" y="40" width="320" height="44" rx="8" class="terminal"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" class="title-text">Open app</text></g>

<g><rect x="180" y="120" width="320" height="44" rx="8" class="step"/>
<text x="340" y="142" text-anchor="middle" dominant-baseline="central" class="title-text">Splash screen</text></g>

<g><rect x="180" y="200" width="320" height="44" rx="8" class="step"/>
<text x="340" y="222" text-anchor="middle" dominant-baseline="central" class="title-text">Language selection</text></g>

<g><rect x="180" y="280" width="320" height="44" rx="8" class="step"/>
<text x="340" y="302" text-anchor="middle" dominant-baseline="central" class="title-text">Onboarding</text></g>

<g><polygon points="340,360 415,405 340,450 265,405" class="decision"/>
<text x="340" y="405" text-anchor="middle" dominant-baseline="central" class="title-text">Continue as guest?</text></g>
<text x="425" y="398" class="sub-text">Yes</text>
<text x="350" y="470" text-anchor="middle" class="sub-text">No</text>
<line x1="415" y1="405" x2="560" y2="405" class="arrow"/>

<line x1="340" y1="450" x2="340" y2="486" class="arrow" marker-end="url(#arrow)"/>

<g><polygon points="340,486 415,531 340,576 265,531" class="decision"/>
<text x="340" y="531" text-anchor="middle" dominant-baseline="central" class="title-text">Existing user?</text></g>
<text x="170" y="600" class="sub-text">Yes</text>
<text x="470" y="600" class="sub-text">No</text>

<line x1="340" y1="576" x2="340" y2="594" class="arrow"/>
<path d="M340,594 L225,594 L225,612" fill="none" class="arrow" marker-end="url(#arrow)"/>
<path d="M340,594 L455,594 L455,612" fill="none" class="arrow" marker-end="url(#arrow)"/>

<g><rect x="150" y="612" width="150" height="44" rx="8" class="step"/>
<text x="225" y="634" text-anchor="middle" dominant-baseline="central" class="title-text">Login</text></g>

<g><rect x="380" y="612" width="150" height="44" rx="8" class="step"/>
<text x="455" y="634" text-anchor="middle" dominant-baseline="central" class="title-text">Signup</text></g>

<line x1="225" y1="656" x2="225" y2="692" class="arrow" marker-end="url(#arrow)"/>
<line x1="455" y1="656" x2="455" y2="692" class="arrow" marker-end="url(#arrow)"/>

<g><rect x="150" y="692" width="150" height="44" rx="8" class="step"/>
<text x="225" y="714" text-anchor="middle" dominant-baseline="central" class="title-text">Verify OTP</text></g>

<g><rect x="380" y="692" width="150" height="44" rx="8" class="step"/>
<text x="455" y="714" text-anchor="middle" dominant-baseline="central" class="title-text">Verify OTP</text></g>

<path d="M225,736 L225,754 L340,754" fill="none" class="arrow"/>
<path d="M455,736 L455,754 L340,754" fill="none" class="arrow"/>
<path d="M560,405 L560,754 L340,754" fill="none" class="arrow"/>
<line x1="340" y1="754" x2="340" y2="784" class="arrow" marker-end="url(#arrow)"/>

<g><rect x="180" y="784" width="320" height="44" rx="8" class="terminal"/>
<text x="340" y="806" text-anchor="middle" dominant-baseline="central" class="title-text">Main navigation (home screen)</text></g>

<rect x="140" y="850" width="16" height="16" rx="3" class="step"/>
<text x="162" y="858" dominant-baseline="central" class="sub-text">Process step</text>
<rect x="300" y="850" width="16" height="16" rx="3" class="decision"/>
<text x="322" y="858" dominant-baseline="central" class="sub-text">Decision point</text>
<rect x="470" y="850" width="16" height="16" rx="3" class="terminal"/>
<text x="492" y="858" dominant-baseline="central" class="sub-text">Start / end</text>
</svg>
